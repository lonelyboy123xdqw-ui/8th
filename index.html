<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

/* ── RESET ── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

:root{
  --g:#00ff41;--p:#ff69b4;--c:#00ffff;
  --r:#ff3333;--y:#ffff00;--d:#003b00;
}

body{
  background:#000;color:var(--g);
  font-family:'Share Tech Mono','Courier New',monospace;
  overflow-x:hidden;min-height:100vh;cursor:none;
}

/* ── PERF LAYERS ── */
canvas{position:fixed;inset:0;pointer-events:none}
#mc{z-index:0;opacity:.09;will-change:transform}
#pc{z-index:1;will-change:transform}

/* ── CURSOR ── */
#cur,#cdot{position:fixed;pointer-events:none;z-index:99999;will-change:transform}
#cur{width:16px;height:16px;border:2px solid var(--g);border-radius:50%;
  mix-blend-mode:screen;transform:translate(-50%,-50%)}
#cdot{width:4px;height:4px;background:var(--g);border-radius:50%;
  transform:translate(-50%,-50%)}

/* ── CRT ── */
#crt{
  position:fixed;inset:0;z-index:9000;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,
    rgba(0,0,0,.07) 2px,rgba(0,0,0,.07) 4px);
  animation:flicker 8s infinite;
}
@keyframes flicker{
  0%,89%,91%,100%{opacity:1}
  90%{opacity:.6}
}
#vig{
  position:fixed;inset:0;z-index:8999;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.8) 100%);
}

/* ── HEART RAIN ── */
#hr{position:fixed;inset:0;pointer-events:none;z-index:8990;display:none}
.ht{
  position:absolute;top:-60px;
  animation:hfall linear forwards;
  filter:drop-shadow(0 0 8px var(--p));
  will-change:transform;
}
@keyframes hfall{
  to{transform:translateY(115vh) rotate(720deg) scale(.4);opacity:0}
}

/* ════════════════════════════════════
   FULL-SCREEN COVER CLICK OVERLAY
════════════════════════════════════ */
#cover{
  position:fixed;inset:0;z-index:99998;
  background:#000;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:28px;cursor:pointer;
  transition:opacity .6s ease;
}
/* Animated grid behind cover */
#cover::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(0,255,65,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,65,.04) 1px,transparent 1px);
  background-size:40px 40px;
  animation:gridmove 4s linear infinite;
}
@keyframes gridmove{to{background-position:40px 40px}}

/* Glowing ring pulse */
#cover::after{
  content:'';position:absolute;
  width:300px;height:300px;border-radius:50%;
  border:1px solid rgba(0,255,65,.15);
  box-shadow:0 0 80px rgba(0,255,65,.08),
             0 0 160px rgba(255,105,180,.05);
  animation:ring 3s ease-in-out infinite;
}
@keyframes ring{
  0%,100%{transform:scale(1);opacity:.5}
  50%{transform:scale(1.3);opacity:1}
}

.cover-logo{
  font-family:'VT323',monospace;
  font-size:clamp(3rem,12vw,7rem);
  color:var(--g);
  text-shadow:0 0 20px var(--g),0 0 60px var(--g),0 0 120px rgba(0,255,65,.3);
  animation:glit 2.5s infinite;
  letter-spacing:.25em;
  position:relative;z-index:1;
}
.cover-logo::before,.cover-logo::after{
  content:attr(data-t);position:absolute;inset:0;
}
.cover-logo::before{
  color:var(--p);animation:gb 2.5s infinite;
  clip-path:polygon(0 20%,100% 20%,100% 45%,0 45%);
}
.cover-logo::after{
  color:var(--c);animation:ga 2.5s infinite;
  clip-path:polygon(0 60%,100% 60%,100% 80%,0 80%);
}
@keyframes glit{
  0%,100%{transform:none}
  20%{transform:skew(-1.5deg)}21%{transform:none}
  60%{transform:skew(.8deg)} 61%{transform:none}
}
@keyframes gb{
  0%,100%{transform:none}
  20%{transform:translateX(-4px)}21%{transform:none}
}
@keyframes ga{
  0%,100%{transform:none}
  40%{transform:translateX(4px)}41%{transform:none}
}

.cover-sub{
  color:var(--p);font-size:.9rem;letter-spacing:.35em;
  text-shadow:0 0 12px var(--p);position:relative;z-index:1;
  animation:blink 2s step-end infinite;
}
.cover-warn{
  color:rgba(0,255,65,.4);font-size:.7rem;letter-spacing:.2em;
  position:relative;z-index:1;
}
.cover-btn{
  position:relative;z-index:1;

}
.cover-btn::before{
  content:'';position:absolute;top:-100%;left:-100%;
  width:300%;height:300%;

    rgba(0,255,65,.12) 50%,transparent 70%);

}
@keyframes shine{to{transform:translate(200%,200%)}}
.cover-btn:hover{
  background:var(--g);color:#000;
  box-shadow:0 0 50px var(--g),0 0 100px rgba(0,255,65,.4);
  transform:scale(1.06);
}

/* Scanline sweep on cover */
.cover-scan{
  position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(transparent 0%,
    rgba(0,255,65,.03) 50%,transparent 100%);

.boot-bar-fill{

.boot-pct{color:var(--g);font-size:1.8rem;font-family:'VT323',monospace;

.ln.on{opacity:1}

.cp{color:var(--p);text-shadow:0 0 8px var(--p)}
.cc{color:var(--c)}
.cr{color:var(--r)}
.cy{color:var(--y)}

.ll.on{opacity:1;transform:none}

/* ── COUNTDOWN ── */

.cdl{color:var(--c);font-size:.75rem;letter-spacing:.25em;margin-bottom:8px}

/* ── FINAL BANNER ── */

  display:none;text-align:center;

  background:rgba(255,105,180,.04);

#fb p{color:#ffb6c1;margin-top:10px;font-size:.95rem;letter-spacing:.15em}

@keyframes blink{50%{opacity:0}}
</style>
</head>

// ── AUDIO ENGINE ────────────────────────────
let AX = null;
function ax(){
  if(!AX) AX = new(window.AudioContext||window.webkitAudioContext)();
  if(AX.state==='suspended') AX.resume();
  return AX;
}

// Basic tone
function tone(freq,dur,type='square',vol=0.04,delay=0){
  try{
    const c=ax(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(0,c.currentTime+delay);
    g.gain.linearRampToValueAtTime(vol,c.currentTime+delay+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+delay+dur);
    o.start(c.currentTime+delay);
    o.stop(c.currentTime+delay+dur+0.05);
  }catch(e){}
}

// Sweep / laser sound
function laser(startF,endF,dur=0.15,vol=0.05){
  try{
    const c=ax(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type='sawtooth';
    o.frequency.setValueAtTime(startF,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(endF,c.currentTime+dur);
    g.gain.setValueAtTime(vol,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
    o.start();o.stop(c.currentTime+dur+0.05);
  }catch(e){}
}

// Noise burst (static / glitch)
function noise(dur=0.08,vol=0.06){
  try{

    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
    const s=c.createBufferSource(),g=c.createGain();
    s.buffer=buf;s.connect(g);g.connect(c.destination);
    g.gain.setValueAtTime(vol,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
    s.start();
  }catch(e){}
}

    this.life-=this.decay;
    if(this.life<=0) this.reset();
  }
}
for(let i=0;i<MAX_PARTS;i++) parts.push(new P());

function burst(x,y,n=25,col='#ff69b4'){
  let added=0;
  for(let i=parts.length-1;i>=0&&added<n;i--){
    if(parts[i].life<.05){
      parts[i].x=x;parts[i].y=y;
      parts[i].vx=(Math.random()-.5)*6;
      parts[i].vy=(Math.random()-.5)*6;
      parts[i].life=1;
      parts[i].decay=.015+Math.random()*.01;
      parts[i].r=Math.random()*3+1;
      parts[i].col=col;
      added++;
    }
  }
}

let pLast=0;
function drawParticles(ts){
  if(ts-pLast>16){
    pLast=ts;
    PX.clearRect(0,0,PC2.width,PC2.height);
    PX.save();
    parts.forEach(p=>{
      p.update();
      PX.globalAlpha=Math.max(0,p.life);
      PX.fillStyle=p.col;
      PX.shadowBlur=6;PX.shadowColor=p.col;
      PX.beginPath();
      PX.arc(p.x,p.y,p.r,0,6.28);
      PX.fill();
    });
    PX.restore();
  }
  requestAnimationFrame(drawParticles);
}
requestAnimationFrame(drawParticles);

// ── COUNTDOWN ───────────────────────────────
function startCountdown(){
  const target=new Date(NEXT_MEETUP).getTime();
  function tick(){
    const diff=target-Date.now();
    const el=document.getElementById('cdval');
    if(!el) return;
    if(diff<=0){el.textContent='THE DAY IS HERE 🥹';return}
    const d=Math.floor(diff/864e5);
    const h=Math.floor((diff%864e5)/36e5);
    const m=Math.floor((diff%36e5)/6e4);
    const s=Math.floor((diff%6e4)/1e3);
    el.textContent=`${String(d).padStart(2,'0')}D  ${String(h).padStart(2,'0')}H  ${String(m).padStart(2,'0')}M  ${String(s).padStart(2,'0')}S`;
  }
  tick();
  setInterval(tick,1000);
}

function shake(intensity=4,duration=150){
  const steps=Math.floor(duration/20);
  let i=0;
  const iv=setInterval(()=>{
    TRM.style.transform=`translate(${(Math.random()-.5)*intensity*2}px,${(Math.random()-.5)*intensity}px)`;

}

// ── RENDER ───────────────────────────────────
function render(item){
  // SFX string shortcuts
  if(typeof item.special==='string' && item.special.startsWith('sfx:')){
    const sfxKey=item.special.replace('sfx:','');
    if(SFX[sfxKey]) SFX[sfxKey]();
    item.special=null;
  }

  const scroll=()=>
    window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});

  if(item.special==='ascii'){
    const d=document.createElement('div');
    d.className='ln on asc';d.textContent=item.text;
    T.appendChild(d);scroll();return;
  }

  if(item.special && item.special.type==='prog'){
    SFX.memFound(item.special.mi||0);
    const wrap=document.createElement('div');
    wrap.className='pw ln on';
    const lbl=document.createElement('span');
    lbl.className=item.cls;lbl.textContent=item.text;lbl.style.flex='1';
    const bw=document.createElement('div');bw.className='pb';
    const bf=document.createElement('div');bf.className='pf';bf.id=item.special.id;
    bw.appendChild(bf);
    const pl=document.createElement('span');
    pl.className='pl';pl.textContent=item.special.pct+'%';
    wrap.append(lbl,bw,pl);T.appendChild(wrap);
    setTimeout(()=>{
      const el=document.getElementById(item.special.id);
      if(el) el.style.width=item.special.pct+'%';
    },120);
    scroll();return;
  }

  if(item.special==='stats'){
    const box=document.createElement('div');
    box.className='sb';
    [
      ['LOVE LEVEL','∞ INFINITE'],
      ['MISS HER','9999 / 10'],
      ['MONTHS',''+MONTHS+' 🔥'],
      ['DISTANCE',DISTANCE],
      ['FIGHTS SURVIVED','ALL OF THEM 💪'],
      ['FUTURE PLANS','ALL WITH HER ♾️'],
    ].forEach(([l,v])=>{
      const si=document.createElement('div');
      si.className='si';
      si.innerHTML=`<span class="sl">${l}</span><span class="sv">${v}</span>`;
      box.appendChild(si);
    });
    T.appendChild(box);
    setTimeout(()=>{box.style.display='grid'},200);
    scroll();return;
  }

  if(item.special==='countdown'){
    SFX.countdown();
    const box=document.createElement('div');
    box.id='cdb';
    box.innerHTML=`<div class="cdl">⏳ TIME UNTIL NEXT MEETUP — TARGET: ${NEXT_MEETUP}</div>
      <div class="cdv" id="cdval">calculating...</div>
      <div class="cds">every second counts — worth every single one</div>`;
    T.appendChild(box);
    setTimeout(()=>{box.style.display='block';startCountdown()},200);
    scroll();return;
  }

  if(item.special==='letter'){
    SFX.decrypt();
    const box=document.createElement('div');
    box.id='lb';
    LOVE_LETTER.split('\n').forEach(line=>{
      const d=document.createElement('div');
      d.className='ll';d.textContent=line||'\u00a0';
      box.appendChild(d);
    });
    T.appendChild(box);
    setTimeout(()=>{
      box.style.display='block';
      box.querySelectorAll('.ll').forEach((l,i)=>
        setTimeout(()=>l.classList.add('on'),i*110));
    },300);
    scroll();return;
  }

  if(item.special==='final'){
    SFX.final();
    startHeartRain();
    for(let i=0;i<10;i++){
      setTimeout(()=>{
        burst(
          Math.random()*window.innerWidth,
          Math.random()*window.innerHeight*.5,
          50,i%2===0?'#ff69b4':'#00ff41'
        );
      },i*180);
    }
    const banner=document.createElement('div');
    banner.id='fb';
    banner.innerHTML=`<h1>HAPPY ${MONTHS}TH MONTHSARY 💕</h1>
      <p>${HER_NAME.toUpperCase()} — you are the best thing in my universe.</p>
      <p style="margin-top:8px;color:#333;font-size:.8rem">LOVE.EXE — running forever ♾️</p>`;
    T.appendChild(banner);
    setTimeout(()=>banner.style.display='block',300);
    scroll();return;
  }

  // default
  SFX.line();
  const d=document.createElement('div');
  d.className=`ln on ${item.cls}`;
  d.textContent=item.text;
  T.appendChild(d);
  scroll();
}

  Q.forEach(item=>{
    tDelay+=item.delay;
    setTimeout(()=>render(item),tDelay);

// ── BOOT SEQUENCE ─────────────────────────────
function runBootScreen(cb){
  const boot=document.getElementById('boot');
  boot.style.display='flex';
  const lines=['bl0','bl1','bl2','bl3','bl4','bl5'];
  const bar=document.getElementById('bbf');
  const pct=document.getElementById('bpct');
  SFX.boot();
  lines.forEach((id,i)=>{
    setTimeout(()=>{
      document.getElementById(id).classList.add('on');
      const p=Math.round((i+1)/lines.length*100);
      bar.style.width=p+'%';
      pct.textContent=p+'%';
      tone(200+i*80,.08,'sine',.05);
      if(i===lines.length-1){
        setTimeout(()=>{
          boot.style.transition='opacity .6s';
          boot.style.opacity='0';
          setTimeout(()=>{boot.style.display='none';cb()},700);
        },600);
      }
    },i*420);
  });
}
